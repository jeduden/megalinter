---
descriptor_id: MARKDOWN
descriptor_type: format
descriptor_flavors:
  - all_flavors # Any project can contain Markdown
  - cupcake
  - formatters
file_extensions:
  - ".md"
linters:
  # MarkdownLint
  - linter_name: markdownlint
    is_formatter: true
    activation_rules:
      - type: variable
        variable: MARKDOWN_DEFAULT_STYLE
        expected_value: markdownlint
        default_value: markdownlint
    linter_text: |
      **markdownlint** is a Node.js static analysis tool and linter for Markdown files that enforces standards and consistency across your documentation. It uses the micromark parser and honors CommonMark specifications while supporting popular GitHub Flavored Markdown extensions.

      **Key Features:**

      - **Comprehensive Rule Set**: Over 50 built-in rules covering heading styles, list formatting, line length, whitespace management, and link validation
      - **Format Support**: Full CommonMark compliance with GitHub Flavored Markdown, tables, autolinks, and extension support for directives, footnotes, and math
      - **Automatic Fixing**: Many rules can automatically repair formatting issues, saving manual effort
      - **Flexible Configuration**: Extensive customization through JSON configuration files with rule-specific settings and style presets
      - **Inline Control**: HTML comment syntax for enabling/disabling rules within documents (`<!-- markdownlint-disable -->`)
      - **Custom Rules**: Extensible architecture allowing project-specific linting requirements
      - **Performance Optimized**: Fast analysis suitable for large documentation projects

      [MarkdownLint](https://github.com/DavidAnson/markdownlint) is run through [markdownlint-cli](https://github.com/igorshubovych/markdownlint-cli)
    linter_url: https://github.com/DavidAnson/markdownlint
    linter_repo: https://github.com/DavidAnson/markdownlint
    linter_spdx_license: MIT
    linter_rules_url: https://github.com/DavidAnson/markdownlint#rules--aliases
    linter_image_url: https://davidanson.gallerycdn.vsassets.io/extensions/davidanson/vscode-markdownlint/0.37.1/1601748708034/Microsoft.VisualStudio.Services.Icons.Default
    linter_rules_configuration_url: https://github.com/igorshubovych/markdownlint-cli#configuration
    linter_rules_inline_disable_url: https://github.com/DavidAnson/markdownlint#configuration
    linter_rules_ignore_config_url: https://github.com/igorshubovych/markdownlint-cli#ignoring-files
    cli_lint_mode: list_of_files
    config_file_name: .markdownlint.json
    cli_lint_fix_arg_name: "--fix"
    cli_lint_errors_count: total_lines
    common_linter_errors:
      - identifier: MARKDOWN_MARKDOWNLINT_ERROR_CONFIG_PARSE
        regex: "Cannot read or parse config file"
        message: |-
          markdownlint could not parse its configuration file. This is typically a syntax error in `.markdownlint.json` / `.markdownlintrc`, most often a `//` or `/* */` comment in a strict-JSON file, a trailing comma, or unbalanced braces.
          Resolutions:
            - Validate the configuration file with a JSON linter and remove comments / trailing commas.
            - If you need comments, rename the file to `.markdownlint.jsonc`, `.markdownlint.yaml`, or `.markdownlint.cjs` (those formats support comments).
            - Reference docs: https://github.com/igorshubovych/markdownlint-cli#configuration
    test_folder: markdown_markdownlint
    examples:
      - "markdownlint myfile.md"
      - "markdownlint -c .markdownlint.json myfile.md"
      - "markdownlint --fix -c .markdownlint.json myfile.md"
    install:
      dockerfile:
        - |-
          # renovate: datasource=npm depName=markdownlint-cli
          ARG NPM_MARKDOWNLINT_CLI_VERSION=0.48.0
      npm:
        - markdownlint-cli@${NPM_MARKDOWNLINT_CLI_VERSION}
    supported_platforms:
      platform:
        - linux/amd64
        - linux/arm64
    ide:
      sublime:
        - name: SublimeLinter-contrib-markdownlint
          url: https://packagecontrol.io/packages/SublimeLinter-contrib-markdownlint
      vim:
        - name: coc-markdownlint
          url: https://github.com/fannheyward/coc-markdownlint
      vscode:
        - name: vscode-markdownlint
          url: https://marketplace.visualstudio.com/items/DavidAnson.vscode-markdownlint
  # remark-lint
  - linter_name: remark-lint
    linter_text: |
      **remark-lint** is a powerful plugin for the remark markdown processor that provides comprehensive linting and formatting capabilities for Markdown files. Built on the unified collective's remark ecosystem, it offers extensive rule-based validation with automatic fixing capabilities and a rich plugin architecture for customized Markdown processing workflows.

      **Key Features:**

      - **Unified Ecosystem**: Part of the remark/unified processing pipeline with access to a vast plugin ecosystem
      - **Comprehensive Rule Set**: Extensive built-in rules for syntax consistency, formatting standards, and structural validation
      - **Automatic Fixing**: Many rules can automatically repair Markdown issues, improving workflow efficiency
      - **Plugin Architecture**: Highly extensible with 100+ community plugins for specialized linting requirements
      - **AST-Based Processing**: Uses Abstract Syntax Tree parsing for deep, accurate Markdown analysis
      - **Configurable Presets**: Pre-configured rule sets for common style guides and formatting conventions
      - **Inline Control**: Marker-based comments for enabling/disabling rules within documents
      - **Performance Optimized**: Efficient processing suitable for large documentation projects and automated pipelines
      - **Standards Compliant**: Supports CommonMark and GitHub Flavored Markdown specifications with extension support
    disabled: true
    disabled_reason: "Bug in remark-lint: <https://github.com/remarkjs/remark-lint/issues/322>"
    is_formatter: true
    activation_rules:
      - type: variable
        variable: MARKDOWN_DEFAULT_STYLE
        expected_value: remark-lint
        default_value: markdownlint
    linter_url: https://remark.js.org/
    linter_repo: https://github.com/remarkjs/remark-lint
    linter_spdx_license: MIT
    linter_image_url: https://raw.githubusercontent.com/remarkjs/remark-lint/02295bc/logo.svg?sanitize=true
    linter_rules_url: https://github.com/remarkjs/remark-lint/blob/main/doc/rules.md#list-of-rules
    linter_rules_configuration_url: https://github.com/remarkjs/remark-lint#configuring-remark-lint
    linter_rules_inline_disable_url: https://github.com/remarkjs/remark-message-control#markers
    config_file_name: ".remarkrc"
    cli_executable: remark
    cli_config_arg_name: "--rc-path"
    cli_lint_extra_args:
      - "--frail"
    cli_lint_fix_arg_name: "-o"
    common_linter_errors:
      - identifier: MARKDOWN_REMARK_LINT_ERROR_PRESET_NOT_FOUND
        regex: 'Could not find (module|preset|plugin) [`''"]'
        message: |-
          remark could not resolve a preset or plugin referenced in your `.remarkrc` (or equivalent config). Every plugin/preset listed in remark configuration must also be installed in `node_modules` next to remark.
          Resolutions:
            - Pre-install the missing preset/plugin into MegaLinter's npm root (`/node-deps`) via a pre-command in your .mega-linter.yml:
                MARKDOWN_REMARK_LINT_PRE_COMMANDS:
                  - command: "npm install remark-preset-lint-recommended"
                    cwd: "root"
                    continue_if_failed: false
            - Verify the package name in `.remarkrc` matches the actual published name exactly.
            - If you only use built-in / bundled presets, remove the custom entry from your config.
    test_folder: markdown_remark
    test_variables:
      MARKDOWN_DEFAULT_STYLE: remark-lint
    examples:
      - "remark --frail myfile.md"
      - "remark --frail --rc-path .remarkrc myfile.md"
      - "remark --frail -o --rc-path .remarkrc myfile.md"
    install:
      dockerfile:
        - |-
          # renovate: datasource=npm depName=remark-cli
          ARG NPM_REMARK_CLI_VERSION=12.0.1
        - |-
          # renovate: datasource=npm depName=remark-preset-lint-recommended
          ARG NPM_REMARK_PRESET_LINT_RECOMMENDED_VERSION=7.0.1
      npm:
        - remark-cli@${NPM_REMARK_CLI_VERSION}
        - remark-preset-lint-recommended@${NPM_REMARK_PRESET_LINT_RECOMMENDED_VERSION}
    supported_platforms:
      platform:
        - linux/amd64
        - linux/arm64
    ide:
      sublime:
        - name: SublimeLinter-contrib-remark-lint
          url: https://packagecontrol.io/packages/SublimeLinter-contrib-remark-lint
      vim:
        - name: ale
          url: https://github.com/w0rp/ale
      vscode:
        - name: vscode-remark-lint
          url: https://github.com/drewbourne/vscode-remark-lint
  # Markdown table formatter
  - linter_name: markdown-table-formatter
    is_formatter: true
    linter_text: |
      **markdown-table-formatter** is a specialized formatting tool that detects and automatically corrects improperly formatted Markdown tables, ensuring consistent presentation and improved readability across documentation.

      **Key Features:**

      - **Automatic Table Detection**: Identifies poorly formatted Markdown tables with misaligned columns and inconsistent spacing
      - **Intelligent Alignment**: Automatically aligns table columns and adjusts padding for optimal readability
      - **Consistent Formatting**: Standardizes table structure with uniform spacing, borders, and column alignment
      - **Preserves Content**: Maintains all table data while improving presentation and formatting
      - **Batch Processing**: Efficiently formats multiple tables within single or multiple Markdown files
      - **Non-Destructive**: Only modifies table formatting without affecting other Markdown content
      - **Standards Compliance**: Ensures tables follow Markdown table formatting best practices and conventions
    linter_url: https://www.npmjs.com/package/markdown-table-formatter
    linter_repo: https://github.com/nvuillam/markdown-table-formatter
    linter_spdx_license: MIT
    linter_rules_configuration_url: https://github.com/nvuillam/markdown-table-formatter#options
    linter_rules_inline_disable_url: https://github.com/nvuillam/markdown-table-formatter#ignoring-code-blocks
    cli_lint_mode: list_of_files
    cli_lint_extra_args:
      - "--check"
    cli_lint_fix_arg_name: "--megalinter-fix-flag" # Workaround for MegaLinter
    cli_lint_fix_remove_args:
      - "--check"
    examples:
      - "markdown-table-formatter --check myfile.md" # Check only
      - "markdown-table-formatter myfile.md" # Apply formatting
      - "markdown-table-formatter myfile.md myfile2.md myfile3.md" # Apply formatting
    test_folder: markdown_markdown_table_formatter
    install:
      dockerfile:
        - |-
          # renovate: datasource=npm depName=markdown-table-formatter
          ARG NPM_MARKDOWN_TABLE_FORMATTER_VERSION=1.7.0
      npm:
        - markdown-table-formatter@${NPM_MARKDOWN_TABLE_FORMATTER_VERSION}
    supported_platforms:
      platform:
        - linux/amd64
        - linux/arm64
    ide:
      vscode:
        - name: Markdown Table Prettify Extension
          url: https://github.com/darkriszty/MarkdownTablePrettify-VSCodeExt
  # rumdl
  - linter_name: rumdl
    can_output_sarif: true
    is_formatter: true
    activation_rules:
      - type: variable
        variable: MARKDOWN_DEFAULT_STYLE
        expected_value: rumdl
        default_value: markdownlint
    linter_text: |
      **rumdl** is a high-performance Markdown linter and formatter that helps ensure consistency and best practices in your Markdown files. Inspired by ruff 's approach to Python linting, rumdl brings similar speed and developer experience improvements to the Markdown ecosystem.

      **Key Features:**

      - Built for speed with Rust - significantly faster than alternatives
      - 57 lint rules covering common Markdown issues
      - Automatic formatting with --fix for files and stdin/stdout
      - Zero dependencies - single binary with no runtime requirements
      - Highly configurable with TOML-based config files
      - Multiple installation options - Rust, Python, standalone binaries
      - Installable via pip for Python users
      - Modern CLI with detailed error reporting
      - CI/CD friendly with non-zero exit code on errors
    linter_url: https://github.com/rvben/rumdl
    linter_repo: https://github.com/rvben/rumdl
    linter_spdx_license: MIT
    linter_rules_url: https://github.com/rvben/rumdl/blob/main/docs/RULES.md
    linter_rules_configuration_url: https://github.com/rvben/rumdl/blob/main/docs/global-settings.md
    linter_rules_inline_disable_url: https://github.com/rvben/rumdl/blob/main/docs/inline-configuration.md
    config_file_name: .rumdl.toml
    test_folder: markdown_rumdl
    test_variables:
      MARKDOWN_DEFAULT_STYLE: rumdl
    cli_lint_mode: list_of_files
    cli_lint_extra_args:
      - "check"
    cli_lint_fix_arg_name: "--fix"
    cli_sarif_args:
      - --output-format
      - sarif
    examples:
      - "rumdl check myfile.md" # Check only
      - "rumdl check --fix myfile.md" # Apply formatting
      - "rumdl check --fix myfile.md myfile2.md myfile3.md" # Apply formatting
    install:
      dockerfile:
        - |-
          # renovate: datasource=pypi depName=rumdl
          ARG PIP_RUMDL_VERSION=0.2.9
      pip:
        - rumdl==${PIP_RUMDL_VERSION}
    supported_platforms:
      platform:
        - linux/amd64
        - linux/arm64
    ide:
      vscode:
        - name: rumdl - Markdown Linter
          url: https://marketplace.visualstudio.com/items?itemName=rvben.rumdl
  # mdsmith
  - linter_name: mdsmith
    is_formatter: true
    activation_rules:
      - type: variable
        variable: MARKDOWN_DEFAULT_STYLE
        expected_value: mdsmith
        default_value: markdownlint
    linter_text: |
      **mdsmith** is a fast Markdown linter, formatter and data extractor shipped as a single static Go binary. Beyond line-level style, it validates document structure and cross-file integrity: broken links and anchors, per-file section schemas, file kinds, and generated sections that keep content in sync across files.

      **Key Features:**

      - **Single Static Binary**: One Go executable with no runtime to start; the workspace walk runs in parallel, an order of magnitude faster than Node markdownlint
      - **Auto-Fix**: `mdsmith fix` rewrites whitespace, headings, code fences, bare URLs, list indentation, and table alignment in place, looping until edits stabilize
      - **Cross-File Integrity**: Flags broken links and missing anchors, enforces per-file section schemas, and keeps Markdown files in the right folders
      - **File Kinds & Schemas**: Tag each file with a kind, then validate its headings and front matter against a schema declared inline or shared via templates
      - **Generated Sections**: `<?toc?>`, `<?catalog?>` and `<?include?>` directives rebuild tables of contents, indexes, and embedded content on fix
      - **Conventions & Flavors**: Pin a Markdown convention to get a curated rule preset and a target renderer flavor in one switch
      - **markdownlint Migration**: `mdsmith init --from-markdownlint` converts an existing markdownlint configuration to `.mdsmith.yml`
      - **Layered Configuration**: Defaults, conventions, kinds, and overrides deep-merge rule by rule, with `--explain` provenance per setting
      - **No Telemetry**: No usage analytics, no error reports, and no outbound network calls at runtime
    linter_url: https://github.com/jeduden/mdsmith
    linter_repo: https://github.com/jeduden/mdsmith
    linter_spdx_license: MIT
    linter_speed: 5
    linter_rules_url: https://github.com/jeduden/mdsmith/tree/main/internal/rules
    linter_rules_configuration_url: https://github.com/jeduden/mdsmith/blob/main/docs/reference/conventions.md
    linter_rules_ignore_config_url: https://github.com/jeduden/mdsmith/blob/main/docs/reference/globs.md
    linter_banner_image_url: https://raw.githubusercontent.com/jeduden/mdsmith/main/website/static/img/logo-lockup.svg
    config_file_name: .mdsmith.yml
    cli_config_arg_name: "--config"
    cli_lint_mode: list_of_files
    cli_lint_extra_args:
      - "check"
    cli_lint_extra_args_after:
      - "--no-color"
    cli_lint_fix_arg_name: "fix"
    cli_lint_fix_remove_args:
      - "check"
    cli_version_arg_name: "version"
    cli_lint_errors_count: regex_count
    cli_lint_errors_regex: ":[0-9]+:[0-9]+ MDS[0-9]{3} "
    common_linter_errors:
      - identifier: MARKDOWN_MDSMITH_ERROR_CONFIG_PARSE
        regex: "mdsmith: parsing config file: "
        message: |-
          mdsmith could not parse its configuration file. This is a YAML syntax error in `.mdsmith.yml`, most often an unclosed bracket, bad indentation, or a stray tab character.
          Resolutions:
            - Validate the YAML syntax of `.mdsmith.yml` with a YAML linter.
            - Regenerate a default configuration with `mdsmith init` and re-apply your customizations.
            - Reference docs: https://github.com/jeduden/mdsmith/blob/main/docs/reference/cli/init.md
    test_folder: markdown_mdsmith
    test_variables:
      MARKDOWN_DEFAULT_STYLE: mdsmith
    examples:
      - "mdsmith check myfile.md"
      - "mdsmith check --config .mdsmith.yml myfile.md myfile2.md"
      - "mdsmith fix --config .mdsmith.yml myfile.md"
    install:
      apk:
        - curl
      dockerfile:
        - |-
          # renovate: datasource=github-releases depName=jeduden/mdsmith extractVersion=^v(?<version>.+)$
          ARG MARKDOWN_MDSMITH_VERSION=0.45.0
        - |-
          RUN set -eu; \
              case "$TARGETPLATFORM" in \
                linux/amd64) ARCH=amd64 ;; \
                linux/arm64) ARCH=arm64 ;; \
                *) echo "unsupported platform: $TARGETPLATFORM" >&2; exit 1 ;; \
              esac; \
              curl --retry 5 --retry-delay 5 -fsSL -o /usr/bin/mdsmith \
                "https://github.com/jeduden/mdsmith/releases/download/v${MARKDOWN_MDSMITH_VERSION}/mdsmith-linux-${ARCH}" && \
              chmod +x /usr/bin/mdsmith
    supported_platforms:
      platform:
        - linux/amd64
        - linux/arm64
    ide:
      vim:
        - name: mdsmith LSP for Neovim
          url: https://github.com/jeduden/mdsmith/blob/main/docs/guides/editors/neovim.md
      vscode:
        - name: mdsmith
          url: https://marketplace.visualstudio.com/items?itemName=jeduden.mdsmith
